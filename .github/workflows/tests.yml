name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    # The runtime is zero-dependency and claims Python >= 3.10, so the matrix is
    # the claim: if a version here fails, the claim in pyproject.toml is wrong.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Suite
        run: python -m unittest discover -s tests -t . -v
      - name: Examples
        run: |
          python examples/jira_workflow.py
          python examples/portable_contract.py
          python examples/issue_domain_how.py

  install:
    # The suite exercises the library; this exercises what a person actually
    # runs. A green suite over a broken installer is the failure this catches.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, then verify the install
        shell: bash
        run: |
          python install.py --dry-run
          python install.py
          python install.py --verify
      - name: Reinstalling must not clobber a settled store
        shell: bash
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, "runtime")
          from howdo.context import complete_onboarding, inspect_context, resolve_context_path
          p = resolve_context_path(None)
          complete_onboarding(
              p,
              calibration_domain="ci smoke",
              representation_observation="diagram before terminology landed",
              landed_example="a worked trace",
              rejected_example="a bare definition table",
          )
          print("settled:", inspect_context(p).state, p)
          EOF
          python install.py
          python install.py --verify

  plugin:
    # The plugin path is a second way to install the same payload, and the way
    # two install paths fail is by drifting. This runs the assembler on every
    # platform the ordinary install runs on: the Windows leg is the point, since
    # that is where the exec bit does not exist and the shebang means nothing.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble a plugin root
        shell: bash
        run: |
          python install.py --plugin dist/how-do --dry-run
          python install.py --plugin dist/how-do
      - name: The manifest is valid JSON and versioned from the skill
        shell: bash
        run: |
          python - <<'EOF'
          import json, pathlib, re
          manifest = json.loads(pathlib.Path("dist/how-do/.claude-plugin/plugin.json").read_text())
          skill = pathlib.Path("dist/how-do/SKILL.md").read_text(encoding="utf-8")
          declared = re.search(r'(?m)^\s*version:\s*"?([^"\s]+)"?\s*$', skill).group(1)
          assert manifest["version"] == declared, (manifest["version"], declared)
          assert manifest["name"] == "how-do", manifest["name"]
          print("manifest ok:", manifest["name"], manifest["version"])
          EOF
      - name: The shipped helper runs where a host would put it
        shell: bash
        run: |
          python dist/how-do/bin/howdo-context --path
          python dist/how-do/bin/howdo-context
