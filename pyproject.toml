[project]
name = "howdo-runtime"
version = "0.8.0"
description = "Tiny reference runtime for the How Do discipline"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "runtime"}

[tool.setuptools.packages.find]
where = ["runtime"]
